<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>SCAN2QUIZ — Vật lí 10 — Đề 1</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#172033;--muted:#667085;--border:#dce2ed;--accent:#5b5ce2;--sel:#eeefff;--good:#16845b;--bad:#c13b4a}
[data-theme=dark]{--bg:#10131c;--card:#1a2030;--fg:#edf1fa;--muted:#a6b0c5;--border:#30394d;--accent:#a4a5ff;--sel:#303253;--good:#57d6a1;--bad:#ff8995}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 48px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.muted{color:var(--muted)}button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--fg)}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:clamp(20px,4vw,32px);box-shadow:0 12px 36px #0000000d}.progress{height:6px;background:var(--border);border-radius:8px;overflow:hidden;margin:14px 0 24px}.bar{height:100%;background:var(--accent);width:0;transition:width .25s}.answers{display:grid;gap:10px;margin:24px 0}.answer{text-align:left;width:100%;display:flex;gap:12px;align-items:flex-start;transition:transform .15s,border-color .15s,background .15s}.answer:hover{transform:translateY(-1px);border-color:var(--accent)}.answer.selected{background:var(--sel);border-color:var(--accent);animation:pop .24s ease}.letter{font-weight:800;min-width:24px}.nav{display:flex;justify-content:space-between;gap:10px}.hidden{display:none!important}@keyframes pop{50%{transform:scale(1.015)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="top"><div><strong>SCAN2QUIZ</strong><div class="muted">Vật lí 10 · Đề 1</div></div><button id="theme">☾ Giao diện tối</button></div><section class="card" id="quiz"><div class="muted" id="count"></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="note" class="muted"></div><div class="answers" id="answers"></div><div class="nav"><button id="prev">Câu trước</button><button class="primary" id="next">Bỏ qua</button></div></section><section class="card hidden" id="result"><h1>Đã nộp bài</h1><p id="score"></p><div id="review"></div><button class="primary" id="restart">Làm lại</button></section></main>
<script>
const qs=[
["Thiết bị nào sau đây có ứng dụng kiến thức về nhiệt là chủ yếu?",["Điện thoại.","Nhiệt kế.","Cân điện tử.","Ti vi."]],
["Cơ chế của các phản ứng hóa học được giải thích dựa trên kiến thức thuộc lĩnh vực nào của Vật lí?",["Nhiệt học.","Cơ học.","Lượng tử.","Quang học."]],
["Kiến thức về từ trường Trái Đất được dùng để giải thích đặc điểm nào của loài chim di trú?",["Xác định hướng bay.","Làm tổ.","Sinh sản.","Kiếm ăn."]],
["Kết luận nào sau đây về ô tô điện là chưa đúng?",["Hoạt động bằng pin acquy.","Thân thiện với môi trường.","Hoạt động bằng nhiên liệu.","Hoạt động bằng năng lượng Mặt Trời."]],
["Các hiện tượng vật lí nào sau đây liên quan đến phương pháp lí thuyết?",["Ô tô khi chạy đường dài có thể xem ô tô như là một chất điểm.","Thả rơi một vật từ trên cao xuống mặt đất.","Kiểm tra sự thay đổi nhiệt độ trong quá trình nóng chảy hoặc bay hơi của một chất.","Ném một quả bóng lên trên cao."]],
["Các hiện tượng vật lí nào sau đây không liên quan đến phương pháp lí thuyết?",["Tính toán quỹ đạo chuyển động của Sao Hỏa dựa vào toán học.","Quả địa cầu là mô hình thu nhỏ của Trái Đất.","Biểu diễn đường truyền ánh sáng qua thấu kính.","Ném một quả bóng lên trên cao."]],
["Khi nói về những quy tắc an toàn khi làm việc với phóng xạ, phát biểu nào sau đây là sai?",["Giảm thời gian tiếp xúc với nguồn phóng xạ.","Tăng khoảng cách từ ta đến nguồn phóng xạ.","Đảm bảo che chắn những cơ quan trọng yếu của cơ thể.","Mặc áo phông và không cần đeo mặt nạ."]],
["Chọn đáp án sai khi nói về những quy tắc an toàn trong phòng thí nghiệm:",["Đọc kĩ hướng dẫn sử dụng thiết bị và quan sát các chỉ dẫn, kí hiệu trên thiết bị thí nghiệm.","Bật công tắc nguồn thiết bị điện sau khi cắm hoặc tháo thiết bị điện.","Kiểm tra cẩn thận thiết bị, phương tiện, dụng cụ thí nghiệm trước khi sử dụng.","Chỉ tiến hành thí nghiệm khi được sự cho phép của giáo viên hướng dẫn."]],
["Sai số hệ thống là",["Sai số do cấu tạo dụng cụ gây ra.","Sai số do điểm 0 ban đầu của dụng cụ đo bị lệch.","Không thể tránh khỏi khi đo.","Do chịu tác động của các yếu tố ngẫu nhiên bên ngoài."]],
["Cách hạn chế các sai số thường gặp",["Thực hiện các thao tác thí nghiệm đúng cách.","Đọc và ghi kết quả đúng cách.","Chọn các thang đo phù hợp với dụng cụ thí nghiệm.","Tất cả các đáp án trên."]],
["Cho các dữ kiện: 1. Kiểm tra giả thuyết; 2. Hình thành giả thuyết; 3. Rút ra kết luận; 4. Đề xuất vấn đề; 5. Quan sát hiện tượng, suy luận. Sắp xếp đúng các bước tìm hiểu thế giới tự nhiên dưới góc độ vật lí.",["1 – 2 – 3 – 4 – 5.","2 – 1 – 5 – 4 – 3.","5 – 2 – 1 – 4 – 3.","5 – 4 – 2 – 1 – 3."]],
["Biển báo hình người đeo kính bảo hộ mang ý nghĩa:",["Cần đeo mặt nạ phòng độc.","Cần mang đồ bảo hộ cơ thể, chống hóa chất, chống nước.","Cần mang kính bảo vệ mắt khỏi hóa chất độc hại và đảm bảo thị lực trong phòng thí nghiệm.","Bao tay chống hóa chất, chống khuẩn."]],
["Biển báo hình găng tay bảo hộ mang ý nghĩa:",["Cần đeo mặt nạ phòng độc.","Cần mang đồ bảo hộ cơ thể, chống hóa chất, chống nước.","Cần mang kính bảo vệ mắt khỏi hóa chất độc hại và đảm bảo thị lực trong phòng thí nghiệm.","Bao tay chống hóa chất, chống khuẩn."]],
["Nêu những ảnh hưởng của vật lí đến lĩnh vực công nghiệp?",["Là động lực của cuộc cách mạng công nghiệp.","Nhờ vật lí mà sản xuất thủ công nhỏ lẻ chuyển thành dây chuyền, tự động hóa.","Giúp giải phóng sức lao động của con người.","Cả A, B và C."]],
["Bạn Việt đi xe đạp đến trường theo đường thẳng. Khi đến quán báo, bạn nhớ quên sách ở nhà nên quay về lấy rồi đạp xe đến trường. Nhà–quán báo 400 m, nhà–trường 1000 m. Độ dời khi quay từ quán báo về nhà và khi từ quán báo đến trường lần lượt là:",["400 m và 600 m.","400 m và 1000 m.","−400 m và 1000 m.","−400 m và 600 m."]],
["Công thức nào sau đây có thể dùng để tính tốc độ trung bình của chuyển động thẳng, không đổi hướng?",["v = s/t","v = v₀ + 1/2 a·t²","v = (v₁ + v₂)/2","Cả A và C."]],
["Một người chuyển động thẳng có độ dịch chuyển d₁ tại t₁ và d₂ tại t₂. Vận tốc trung bình từ t₁ đến t₂ là:",["v_tb = (d₁ − d₂)/(t₁ + t₂)","v_tb = (d₂ − d₁)/(t₂ − t₁)","v_tb = (d₁ + d₂)/(t₂ − t₁)","v_tb = 1/2 × (d₁/t₁ + d₂/t₂)"]],
["Tốc độ là đại lượng đặc trưng cho",["Tính chất nhanh hay chậm của chuyển động.","Sự thay đổi hướng của chuyển động.","Khả năng duy trì chuyển động của vật.","Sự thay đổi vị trí của vật trong không gian."]],
["Độ lớn độ dịch chuyển và quãng đường bằng nhau khi vật",["Chuyển động tròn.","Chuyển động thẳng và không đổi chiều.","Chuyển động thẳng và chỉ đổi chiều 1 lần.","Chuyển động thẳng và chỉ đổi chiều 2 lần."]],
["Đồ thị độ dịch chuyển–thời gian của xe có đoạn thẳng tăng từ 0 đến t₁ và đoạn nằm ngang từ t₁ đến t₂. Trong khoảng nào xe chuyển động thẳng đều?",["Chỉ từ 0 đến t₁.","Chỉ từ t₁ đến t₂.","Trong khoảng từ 0 đến t₂.","Không có lúc nào xe chuyển động thẳng đều."]],
["Độ dịch chuyển của vật trong khoảng thời gian từ t₁ đến t₂ được xác định bằng",["Diện tích giới hạn của hình chữ nhật CBED.","Diện tích giới hạn của tam giác OACB.","Diện tích giới hạn của hình thang OABC.","Diện tích giới hạn của hình thang ABFD."]],
["Gia tốc là một đại lượng",["Đại số, đặc trưng cho sự biến thiên nhanh hay chậm của chuyển động.","Đại số, đặc trưng cho tính không đổi của vận tốc.","Vectơ, đặc trưng cho sự biến thiên nhanh hay chậm của chuyển động.","Vectơ, đặc trưng cho sự biến thiên nhanh hay chậm của vận tốc."]],
["Xe ô tô đang chuyển động thẳng với vận tốc 20 m/s thì bị hãm phanh chậm dần đều. Quãng đường từ lúc hãm phanh đến khi dừng hẳn là 100 m. Gia tốc của xe là",["1 m/s².","−1 m/s².","−2 m/s².","5 m/s²."]],
["Xác định phương trình chuyển động và độ lớn vận tốc của hai chuyển động có đồ thị ở Hình 7.2.",["d₁ = 60 + 10t; v₁ = 10 km/h; d₂ = −10t; v₂ = 10 km/h.","d₁ = 60 − 10t; v₁ = 10 km/h; d₂ = 12t; v₂ = 12 km/h.","d₁ = 60 − 20t; v₁ = 20 km/h; d₂ = 12t; v₂ = 12 km/h.","d₁ = −10t; v₁ = 10 km/h; d₂ = 12t; v₂ = 12 km/h."]],
["Một vật chuyển động thẳng biến đổi đều có đồ thị vận tốc v theo thời gian t như hình vẽ. Phương trình vận tốc của vật là",["v = 15 − t (m/s).","v = t + 15 (m/s).","v = 10 − 15t (m/s).","v = 10 − 5t (m/s)."]]
];
const notes={8:"Bản scan có dấu bút tại một số lựa chọn; không dùng dấu khoanh làm đáp án chính thức.",11:"Cần đối chiếu hình biển báo ở bản gốc.",12:"Hình biển báo trong bản scan khá mờ.",14:"Dữ liệu vị trí được đọc từ hình trong đề.",19:"Mô tả đồ thị được lấy từ bản scan; đối chiếu hình gốc nếu cần chấm chính xác.",20:"Câu phụ thuộc hình đồ thị trong đề.",23:"Câu phụ thuộc đồ thị Hình 7.2; hãy đối chiếu bản scan trước khi chấm.",24:"Câu phụ thuộc đồ thị v–t; cần kiểm tra hình gốc."};
let idx=0,answers=Array(qs.length).fill(null),submitted=false;
const $=id=>document.getElementById(id);
function render(){if(submitted)return;$('count').textContent='Câu '+(idx+1)+' / '+qs.length;$('bar').style.width=((idx+1)/qs.length*100)+'%';$('question').textContent=qs[idx][0];$('note').textContent=notes[idx]||'';$('answers').innerHTML='';qs[idx][1].forEach((txt,i)=>{let b=document.createElement('button');b.className='answer'+(answers[idx]===i?' selected':'');b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'.</span><span></span>';b.lastChild.textContent=txt;b.onclick=()=>{answers[idx]=i;render();if(idx<qs.length-1){idx++;render()}else submit()};$('answers').appendChild(b)});$('prev').disabled=idx===0;$('next').textContent=idx===qs.length-1?'Nộp bài':'Bỏ qua'}
function submit(){submitted=true;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let n=answers.filter(x=>x!==null).length;$('score').textContent='Đã trả lời '+n+'/'+qs.length+' câu. Đề scan chưa có đáp án chính thức nên không tự chấm điểm để tránh đoán đáp án.';$('review').textContent='Các câu có hình/đồ thị hoặc dấu bút cần đối chiếu PDF gốc trước khi chấm.'}
$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<qs.length-1){idx++;render()}else submit()};$('restart').onclick=()=>{idx=0;answers=Array(qs.length).fill(null);submitted=false;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('theme').onclick=()=>{let d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'light';$('theme').textContent=d?'☀ Giao diện sáng':'☾ Giao diện tối'};render();
</script></body></html>
